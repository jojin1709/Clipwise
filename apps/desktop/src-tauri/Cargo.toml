[package]
name = "clipwise"
version = "0.1.0"
description = "Local-first AI product showcase generator"
authors = ["Clipwise — Jojin John"]
edition = "2021"

[lib]
name = "clipwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-opener = "2"
