<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2f"/>
      <stop offset="50%" stop-color="#0e2a47"/>
      <stop offset="100%" stop-color="#1687ff"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4"/>
  <!-- Play triangle with rounded corners -->
  <path d="M 200 156 L 372 256 L 200 356 Z" fill="url(#playGrad)" filter="url(#glow)"/>
  <!-- AI Sparkles -->
  <path d="M 390 130 Q 390 155 415 155 Q 390 155 390 180 Q 390 155 365 155 Q 390 155 390 130 Z" fill="url(#sparkle)"/>
  <path d="M 150 350 Q 150 365 165 365 Q 150 365 150 380 Q 150 365 135 365 Q 150 365 150 350 Z" fill="url(#sparkle)"/>
</svg>
