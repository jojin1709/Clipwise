name: Build & Release Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Windows Application (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm install

      - name: Build shared packages & frontend
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Build Tauri Windows App (.exe & .msi)
        run: npm run tauri:build

      - name: Prepare release assets & checksums
        id: prepare_assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release

          # Copy NSIS installer (.exe)
          $nsisFiles = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsisFiles) {
            $nsisFiles | Copy-Item -Destination "dist-release/"
            Write-Host "Found NSIS installer: $($nsisFiles.Name)"
          }

          # Copy MSI installer (.msi)
          $msiFiles = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if ($msiFiles) {
            $msiFiles | Copy-Item -Destination "dist-release/"
            Write-Host "Found MSI installer: $($msiFiles.Name)"
          }

          # Copy standalone portable executable
          if (Test-Path "apps/desktop/src-tauri/target/release/clipwise.exe") {
            Copy-Item "apps/desktop/src-tauri/target/release/clipwise.exe" "dist-release/clipwise-portable.exe"
            Write-Host "Found standalone executable: clipwise-portable.exe"
          }

          # Generate SHA256 Checksums
          Get-ChildItem -Path "dist-release/*" | Where-Object { -not $_.PSIsContainer } | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding utf8 -FilePath "dist-release/SHA256SUMS.txt"

          # Determine Tag & Title
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            $title = "Clipwise $tag"
          } else {
            $tag = "v0.1.${{ github.run_number }}"
            $title = "Clipwise v0.1.${{ github.run_number }} (Automated Build)"
          }

          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "title=$title" >> $env:GITHUB_OUTPUT

          Write-Host "Release Tag: $tag"
          Write-Host "Release Title: $title"
          Get-ChildItem -Path "dist-release"

      - name: Upload build artifacts (CI summary)
        uses: actions/upload-artifact@v4
        with:
          name: clipwise-windows-build
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag }}
          name: ${{ steps.prepare_assets.outputs.title }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-release/*.exe
            dist-release/*.msi
            dist-release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
