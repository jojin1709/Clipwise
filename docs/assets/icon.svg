<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="clipwiseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="30" ry="30" fill="url(#clipwiseGrad)" filter="url(#glow)"/>
  <rect x="8" y="8" width="112" height="112" rx="30" ry="30" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>
  
  <!-- Centered Lucide Bolt Icon -->
  <g transform="translate(32, 28) scale(2.65)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
